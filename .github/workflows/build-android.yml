name: Build Android APK

on:
  push:
    branches: [ main, master ] # Déclenche le build à chaque push sur main ou master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # On reste sur ta version ultra-récente

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Requis pour compiler les projets Android modernes

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor to Android Native
        run: npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: physis-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk